# --- GENERAL ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB" # true color
set -g mouse on # scroll, click and resize panes
set -g history-limit 50000 # room for long agent logs
set -g escape-time 10 # no lag on esc in vim and agent TUIs
set -g focus-events on
set -g set-clipboard on # copy to the local clipboard over ssh
set -g base-index 1 # windows start at 1 to match the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
# --- GENERAL ---

# --- STATUS ---
set -g status-interval 5
set -g status-left-length 20
set -g status-right " #h " # which Mac this is
# --- STATUS ---

# --- KEYS ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind b display-popup -E -w 90% -h 90% btop # cpu, memory and processes, q to close
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# --- KEYS ---
